global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'personal-agent'
    static_configs:
      - targets: ['personal-agent:8000']

  - job_name: 'windows-exporter'
    static_configs:
      - targets: ['host.docker.internal:9182']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
